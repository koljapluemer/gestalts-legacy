schema: 1
id: conformance
version: 0.1.0
gestalts: []
worker:
  runtime: uv
  project: worker
  command: [python, -m, conformance_worker]
  triggers:
    - on: change
      query:
        gestalt: flashcard@1
        where: {status: queued}
    - on: schedule
      cron: "0 6 * * *"
  services: [conformance-worker@1]
  access:
    read:
      gestalts: [flashcard@1]
    write:
      tags_all: [plugin-conformance]
    blobs:
      read: referenced
      write: true
  network: []
