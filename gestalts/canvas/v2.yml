name: canvas
version: 2
description: >-
  An infinite plane of free Markdown text and linked notes, stored on the note it is about as `canvas.nodes`.
  Nodes are in z-order, each at its top-left position, with exactly one of `text` or `note` (a note id). Every
  linked note is also an `on-canvas` relationship of the note, so it travels with it. Replaces a `canvas@1`
  note that is `canvas-of` it, which is folded in (and retired) on the first save.
trigger_fields: [canvas]
fields:
  canvas:
    type: map
    required: true
    fields:
      nodes:
        type: list
        required: true
        items:
          type: map
          fields:
            id: { type: string, required: true }
            x: { type: number, required: true }
            y: { type: number, required: true }
            text: { type: text }
            note: { type: string }
merge:
  keys:
    canvas: { keys: { nodes: { list_by: id, item: { keys: { text: text } } } } }
