name: conflict
version: 1
description: >-
  A value both sides of a sync changed differently that no merge rule settled: in the note `note` (which it is
  `conflict-of`), at `path` (keys, and `{by, id}` for an item of a list), with the `base` and both sides. The note
  keeps `kept`; `lost` is the other side. A missing `base`, `kept` or `lost` means the value was absent there; `raw`
  means they are whole note texts. Keyed `stableId("conflict", "<note>#<path>#<hash of the values>")`, so devices
  recording the same conflict write one note. Resolving it (in the editor, or deterministically in code) writes the
  chosen value into the note and deletes this one.
requires_tags: [conflict]
fields:
  note: { type: string, required: true }
  path: { type: list, required: true }
  raw: { type: bool }
  recorded: { type: datetime, required: true }
relationships:
  conflict-of: { min: 1, max: 1 }
merge:
  keys:
    recorded: min
