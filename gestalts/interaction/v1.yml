name: interaction
version: 1
description: >-
  Something an `actor` scene object can do, optionally to a `target`. `effects` says what happens to each (an
  effect or reaction code, a replacement image), `instructions` maps a language to the sentences that ask for it.
requires_tags: [interaction]
fields:
  action: { type: string, required: true }
  effects: { type: map }
  instructions: { type: map }
relationships:
  actor: { min: 1, max: 1 }
  target: { max: 1 }
