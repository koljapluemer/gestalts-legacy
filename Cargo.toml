[workspace]
resolver = "3"
members = ["crates/core", "crates/fs", "crates/wasm", "crates/connector"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
gestalts-core = { path = "crates/core" }
gestalts-fs = { path = "crates/fs" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5"] }

[profile.release.package.gestalts-wasm]
opt-level = "s"
